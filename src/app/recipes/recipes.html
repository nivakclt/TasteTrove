<app-header></app-header>

<!-- recipes -->
<div class="container-fluid" style="min-height: 80vh;">
  <div class="row">

    <div class="col-sm-12 col-md-3 p-2 border-end">
      <h4 class="mt-3">Filters</h4>

      <button class="btn w-100 my-2">All</button>

      <!-- cuisine filter -->
      <button
        class="btn w-100 mb-2"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#cuisine"
        aria-expanded="false"
        aria-controls="cuisine"
      >
        Cuisine <i class="fa-solid fa-chevron-down text-dark"></i>
      </button>

      <div class="collapse" id="cuisine">
        <div class="card card-body">
          Cuisine Filters
        </div>
      </div>

      <!-- meal types filter -->
      <button
        class="btn w-100 mb-2"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#meal"
        aria-expanded="false"
        aria-controls="meal"
      >
        Meals <i class="fa-solid fa-chevron-down text-dark"></i>
      </button>

      <div class="collapse" id="meal">
        <div class="card card-body">
          Meal Filters
        </div>
      </div>

    </div>

    <!-- recipes -->
       <div class="col-sm-12 col-md-9 p-2">
      <div class="d-flex justify-content-between align-items-center">
        <h4 class="display-4">Recipes</h4>
        <div class="w-50">
          <input type="search" placeholder="Enter keyword to search" class="form-control" />
        </div>
      </div>
      <div class="d-flex justify-content-around flex-wrap gap-2 mt-5">
        <div class="card" style="width: 18rem">
          <img
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQjILHqf6lDFKZHYXcAPx4OPJu6nDdCyxI4iplW2pRpnRvU4qQilweXihA&s=10"
            class="card-img-top"
            height="300px"
            alt="biriyani"
          />
          <div class="card-body">
            <h5 class="card-title">Biriyani</h5>
            <p class="card-text">Indian</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<app-footer></app-footer>
